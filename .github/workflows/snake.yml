name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write  # allow pushing to repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Generate the snake SVG
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: AresIntrepid
          outputs: github-contribution-grid-snake.svg   # output in root for simplicity

      # Commit and push to the 'output' branch
      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: "github-contribution-grid-snake.svg"
          message: "Generate snake animation"
          new_branch: "output"
          push: true
